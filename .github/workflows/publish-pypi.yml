name: Publish Python package
run-name: PyPI / ${{ inputs.mode }} / bindings runs ${{ inputs.package_run_ids }}

on:
  pull_request:
    paths:
      - '.github/workflows/publish-pypi.yml'
      - '.github/scripts/publish_registry.py'
      - '.github/scripts/release.py'
  workflow_dispatch:
    inputs:
      package_run_ids:
        description: Successful Package bindings run IDs, separated by commas or spaces
        required: true
        type: string
      mode:
        description: Check distributions or publish to pypi.org
        type: choice
        default: check
        options: [check, publish]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate publisher syntax
        run: python -m py_compile .github/scripts/publish_registry.py .github/scripts/release.py

  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install wheel metadata tools
        run: python -m pip install packaging 'twine>=6,<7'
      - name: Collect tested wheels and check existing PyPI files
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_IDS: ${{ inputs.package_run_ids }}
        run: |
          python .github/scripts/publish_registry.py prepare-pypi
          python .github/scripts/publish_registry.py check-pypi
      - name: Validate distribution metadata
        run: python -m twine check build/registry/pypi/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: build/registry/pypi/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/pylibseekdb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: build/registry/pypi
      - name: Recheck hashes and select wheels not yet published
        id: uploads
        run: python .github/scripts/publish_registry.py pypi-uploads
      - name: Publish pylibseekdb with Trusted Publishing
        if: steps.uploads.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: build/registry/pypi-upload/
