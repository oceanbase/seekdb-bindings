name: Test Android artifacts
run-name: Test Android artifacts / bindings run ${{ inputs.package_run_id }}

on:
  pull_request:
    paths:
      - '.github/workflows/android-smoke.yml'
      - '.github/scripts/smoke_android.py'
      - '.github/scripts/android_container.py'
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Completed bindings run containing bindings-android-arm64
        required: true
        type: string
  workflow_call:
    inputs:
      package_run_id:
        description: Bindings run containing bindings-android-arm64
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile .github/scripts/smoke_android.py .github/scripts/android_container.py

  prepare-consumer:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.package_run_id }}
          name: bindings-android-arm64
          github-token: ${{ github.token }}
          path: dist
      - name: Install test APK build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platforms;android-30'
      - name: Prepare consumers using the finished AAR and SDK
        run: python .github/scripts/smoke_android.py --prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-consumer
          path: build/android-smoke-input.tar.gz
          compression-level: 0

  runtime:
    needs: prepare-consumer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-test-consumer
          path: input
      - name: Download the distributions to validate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.package_run_id }}
          name: bindings-android-arm64
          github-token: ${{ github.token }}
          path: dist
      - name: Start native arm64 Android on the GitHub arm64 host
        run: python .github/scripts/android_container.py start
      - name: Smoke test the finished arm64 AAR and C SDK
        run: python .github/scripts/smoke_android.py --prepared input/android-smoke-input.tar.gz --serial 127.0.0.1:5555
      - name: Collect Android diagnostics and stop the container
        if: always()
        run: python .github/scripts/android_container.py stop
      - name: Upload distributions with the passed runtime report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-android-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Preserve Android runtime diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-runtime-diagnostics
          path: |
            build/android-runtime/*.log
            build/android-runtime/*.json
            build/package/android-smoke/*.log
            dist/*-smoke.json*
