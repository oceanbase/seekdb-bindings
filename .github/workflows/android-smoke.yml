name: Test Android artifacts
run-name: Test Android artifacts / bindings run ${{ inputs.package_run_id }}

on:
  pull_request:
    paths:
      - '.github/workflows/android-smoke.yml'
      - '.github/scripts/smoke_android.py'
      - '.github/scripts/android_smoke_host.py'
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Completed bindings run containing bindings-android-arm64
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile .github/scripts/smoke_android.py .github/scripts/android_smoke_host.py

  linux-arm-host:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Probe KVM and Android kernel support
        run: python3 .github/scripts/android_smoke_host.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-linux-arm-host
          path: build/android-host.json

  macos-arm-emulator:
    if: github.event_name == 'workflow_dispatch'
    name: macos-arm64-${{ matrix.mode }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: hardware
            acceleration: on
          - mode: software
            acceleration: off
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download finished Android distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.package_run_id }}
          name: bindings-android-arm64
          github-token: ${{ github.token }}
          path: dist
      - name: Probe Android acceleration on the GitHub macOS runner
        run: python .github/scripts/android_smoke_host.py ${{ matrix.mode == 'hardware' && '--require-acceleration' || '' }}
      - name: Install the test consumer build tools
        run: sdkmanager 'build-tools;35.0.0' 'platforms;android-30'
      - name: Run the finished arm64 AAR on native arm64 Android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          system-image-api-level: 28
          target: google_apis
          arch: arm64-v8a
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -accel ${{ matrix.acceleration }}
          script: python .github/scripts/smoke_android.py
      - name: Preserve runtime diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-macos-${{ matrix.mode }}-diagnostics
          path: |
            build/android-host.json
            build/package/android-smoke/*.log
            dist/*-smoke.json*
