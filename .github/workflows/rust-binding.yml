name: Rust binding

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-binding.yml'
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-binding.yml'

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    name: Native runtime (${{ matrix.target }})
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.rust-target
      SEEKDB_CACHE_DIR: ${{ github.workspace }}/.rust-runtime-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Test validation-script process cleanup
        run: python rust/tests/test_runners.py
      - name: Test the pinned release bundle
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Check formatting
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo fmt --manifest-path rust/tests/consumer/Cargo.toml --all -- --check
      - name: Check warnings
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run synchronous and Tokio SQL examples
        run: python rust/tests/run_examples.py
      - name: Test application and dynamic-library deployment (Linux)
        if: runner.os == 'Linux'
        run: python rust/tests/consumer/test_deployment.py --check-noexec
      - name: Test application and dynamic-library deployment (macOS/Windows)
        if: runner.os != 'Linux'
        run: python rust/tests/consumer/test_deployment.py
      - name: Verify the crate source distribution
        run: python rust/tests/check_package.py
      - name: Test cold manifest download and offline builds
        if: runner.os == 'Linux'
        run: python rust/tests/test_manifest_download.py
