name: Rust binding

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-binding.yml'
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-binding.yml'

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.rust-target
      SEEKDB_CACHE_DIR: ${{ github.workspace }}/.rust-runtime-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the OSS bundle on Linux x86_64
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Check formatting
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo fmt --manifest-path rust/tests/consumer/Cargo.toml --all -- --check
      - name: Run synchronous and Tokio SQL examples
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked --example first_query -- "$(mktemp -d)/database"
          cargo run --manifest-path rust/Cargo.toml --locked --example async_query -- "$(mktemp -d)/database"
      - name: Test application and dynamic-library deployment
        run: bash rust/tests/consumer/test-deployment.sh --check-noexec
