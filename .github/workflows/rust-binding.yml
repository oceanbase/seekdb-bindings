name: Rust binding

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-binding.yml'
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-binding.yml'

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.rust-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the OSS bundle on Linux x86_64
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Check formatting and packaging
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          python3 -m unittest discover -s rust/scripts -p 'test_*.py'
      - name: Run synchronous and Tokio SQL examples
        run: |
          cargo run --manifest-path rust/Cargo.toml --locked --example first_query -- "$(mktemp -d)/database"
          cargo run --manifest-path rust/Cargo.toml --locked --example async_query -- "$(mktemp -d)/database"
      - name: Package and run without the build directory
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$(mktemp -d)"
          python3 rust/scripts/package.py \
            --manifest-path rust/Cargo.toml \
            --example first_query --profile dev --output "$app_dir/app"
          mv "$CARGO_TARGET_DIR" "$CARGO_TARGET_DIR.hidden"
          trap 'mv "$CARGO_TARGET_DIR.hidden" "$CARGO_TARGET_DIR"' EXIT
          cd "$app_dir"
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH ./app/first_query "$app_dir/database"
