name: Pull Request Build and Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'
  # Warm the seekdb binary cache on main so PRs can restore it. GitHub Actions
  # only shares caches with PRs when they are stored on the default branch
  # (see issue #30).
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'

env:
  BUILD_TYPE: Debug
  TEST_TARGET: seekdb_tests
  SEEKDB_ARTIFACT: seekdb-binary

jobs:
  format-check:
    name: Format check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout seekdb-bindings
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          clang-format-14 --version

      - name: Run clang-format check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" -- \
              'lib/include/*.h' \
              'lib/src/*.c' \
              'lib/src/*.h' \
              'lib/tests/*.cc' \
              'lib/tests/*.h' \
              'python/src/*.cc' \
              'python/src/*.cpp' \
              'python/src/*.h'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No clang-format-managed files changed."
            exit 0
          fi
          clang-format-14 --dry-run --Werror "${files[@]}"

  prepare-seekdb:
    name: Prepare seekdb binary
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Normalize build type
        shell: bash
        run: |
          set -euo pipefail
          SEEKDB_BUILD_TYPE="${BUILD_TYPE,,}"
          case "$SEEKDB_BUILD_TYPE" in
            release|debug) ;;
            *) echo "unsupported BUILD_TYPE: $BUILD_TYPE" >&2; exit 1 ;;
          esac
          echo "SEEKDB_BUILD_TYPE=$SEEKDB_BUILD_TYPE" >> "$GITHUB_ENV"

      - name: Restore cached seekdb binary
        id: seekdb_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/seekdb-binary-cache
          key: seekdb-binary-${{ runner.os }}-${{ env.SEEKDB_BUILD_TYPE }}

      - name: Free Disk Space
        if: steps.seekdb_cache.outputs.cache-hit != 'true'
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Prepare seekdb build dependencies
        if: steps.seekdb_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

      - name: Build seekdb from master
        if: steps.seekdb_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SEEKDB_DIR="${{ runner.temp }}/seekdb-master"
          rm -rf "$SEEKDB_DIR"
          git clone --depth 1 --branch master https://github.com/oceanbase/seekdb.git "$SEEKDB_DIR"
          cd "$SEEKDB_DIR"
          build_jobs=$(nproc)
          if [ "$build_jobs" -gt 3 ]; then
            build_jobs=3
          fi
          ./build.sh "$SEEKDB_BUILD_TYPE" --init -DBUILD_EMBED_MODE=ON --make -j"$build_jobs"

      - name: Stage seekdb binary
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${{ runner.temp }}/seekdb-binary-cache"
          mkdir -p "$CACHE_DIR"

          if [ "${{ steps.seekdb_cache.outputs.cache-hit }}" != "true" ]; then
            SEEKDB_DIR="${{ runner.temp }}/seekdb-master"
            SEEKDB_BUILD_DIR="$SEEKDB_DIR/build_$SEEKDB_BUILD_TYPE"
            if [ ! -d "$SEEKDB_BUILD_DIR" ]; then
              echo "seekdb build directory not found: $SEEKDB_BUILD_DIR" >&2
              exit 1
            fi
            mapfile -t SEEKDB_BINS < <(find "$SEEKDB_BUILD_DIR" -type f -name seekdb -executable)
            if [ "${#SEEKDB_BINS[@]}" -eq 0 ]; then
              echo "seekdb binary not found" >&2
              exit 1
            fi
            if [ "${#SEEKDB_BINS[@]}" -gt 1 ]; then
              echo "multiple seekdb binaries found in $SEEKDB_BUILD_DIR" >&2
              printf '%s\n' "${SEEKDB_BINS[@]}" >&2
              exit 1
            fi
            cp "${SEEKDB_BINS[0]}" "$CACHE_DIR/seekdb"
            chmod +x "$CACHE_DIR/seekdb"
          fi

          if [ ! -x "$CACHE_DIR/seekdb" ]; then
            echo "seekdb binary not found in cache: $CACHE_DIR/seekdb" >&2
            exit 1
          fi

      - name: Save seekdb binary cache
        if: steps.seekdb_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/seekdb-binary-cache
          key: seekdb-binary-${{ runner.os }}-${{ env.SEEKDB_BUILD_TYPE }}

      - name: Upload seekdb binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SEEKDB_ARTIFACT }}
          path: ${{ runner.temp }}/seekdb-binary-cache/seekdb
          if-no-files-found: error
          retention-days: 1

  test:
    name: Build and test
    needs: prepare-seekdb
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - &checkout-with-submodules
        name: Checkout seekdb-bindings
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - &setup-python
        name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - &install-python-build-dependencies
        name: Install Python build dependencies
        run: python -m pip install --upgrade pip pybind11

      - &download-seekdb-binary
        name: Download seekdb binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEEKDB_ARTIFACT }}
          path: ${{ runner.temp }}/seekdb-binary-cache

      - &set-seekdb-bin
        name: Set SEEKDB_BIN
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${{ runner.temp }}/seekdb-binary-cache"
          mapfile -t SEEKDB_BINS < <(find "$CACHE_DIR" -type f -name seekdb)
          if [ "${#SEEKDB_BINS[@]}" -ne 1 ]; then
            echo "expected exactly one seekdb binary under $CACHE_DIR, found ${#SEEKDB_BINS[@]}" >&2
            find "$CACHE_DIR" -ls >&2 || true
            exit 1
          fi
          SEEKDB_BIN="${SEEKDB_BINS[0]}"
          # upload-artifact strips the executable bit; restore it before tests spawn seekdb.
          chmod +x "$SEEKDB_BIN"
          echo "SEEKDB_BIN=$SEEKDB_BIN" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSEEKDB_BIN=${{ env.SEEKDB_BIN }}

      - &build-driver
        name: Build seekdb
        run: cmake --build build --target seekdb --parallel

      - &build-python-binding
        name: Build Python binding
        run: cmake --build build --target pylibseekdb --parallel

      - &verify-python-binding-contract
        name: Verify Python binding exception contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.machinery
          import pathlib
          import shutil
          import sys
          import tempfile

          build_dir = pathlib.Path("build")
          candidates = []
          for suffix in importlib.machinery.EXTENSION_SUFFIXES:
              candidates.extend(build_dir.glob(f"pylibseekdb*{suffix}"))
          candidates = sorted(set(candidates))
          if len(candidates) != 1:
              raise SystemExit(f"expected one built pylibseekdb extension, found: {candidates}")

          with tempfile.TemporaryDirectory() as tmp:
              package_dir = pathlib.Path(tmp) / "pylibseekdb"
              package_dir.mkdir()
              shutil.copy2("python/pylibseekdb/__init__.py", package_dir / "__init__.py")
              suffix = candidates[0].name.removeprefix("pylibseekdb")
              shutil.copy2(candidates[0], package_dir / f"pylibseekdb{suffix}")
              for library in build_dir.glob("libseekdb.*"):
                  shutil.copy2(library, package_dir / library.name)

              sys.path.insert(0, tmp)
              import pylibseekdb

              assert issubclass(pylibseekdb.SeekdbError, RuntimeError)
              for name in ("SeekdbError", "Connection", "Cursor"):
                  cls = getattr(pylibseekdb, name)
                  assert cls.__module__ == "pylibseekdb"
                  assert str(cls) == f"<class 'pylibseekdb.{name}'>"
          PY

      - &verify-pure-c-driver
        name: Verify libseekdb has no C++ runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          # Issue #6: only libseekdb must be pure C. The seekdb server
          # binary (build/seekdb) is C++ and may legitimately depend on libstdc++.
          lib="build/libseekdb.so"
          compat="build/libseekdb_driver.so"
          if [ ! -f "$lib" ]; then
            echo "missing $lib" >&2
            exit 1
          fi
          if [ ! -L "$compat" ]; then
            echo "expected compatibility symlink $compat -> libseekdb.so (issue #7)" >&2
            ls -la build/libseekdb*.so >&2 || true
            exit 1
          fi
          if readelf -d "$lib" | grep -E 'NEEDED.*lib(std)?c\+\+'; then
            echo "$lib must not directly depend on the C++ standard library (issue #6)" >&2
            readelf -d "$lib" | grep NEEDED >&2 || true
            exit 1
          fi
          echo "OK: $lib has no libstdc++/libc++ NEEDED entry (seekdb server binary not checked)"

      - &build-tests
        name: Build tests
        run: cmake --build build --target "${{ env.TEST_TARGET }}" --parallel

      - &run-tests
        name: Run tests
        run: ctest --test-dir build --output-on-failure

  asan-ubsan-test:
    name: ASan/UBSan build and test
    needs: prepare-seekdb
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SEEKDB_SANITIZER_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - *checkout-with-submodules
      - *setup-python
      - *install-python-build-dependencies
      - *download-seekdb-binary
      - *set-seekdb-bin

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSEEKDB_BIN=${{ env.SEEKDB_BIN }} \
            "-DCMAKE_C_FLAGS=${{ env.SEEKDB_SANITIZER_FLAGS }}" \
            "-DCMAKE_CXX_FLAGS=${{ env.SEEKDB_SANITIZER_FLAGS }}" \
            "-DCMAKE_EXE_LINKER_FLAGS=${{ env.SEEKDB_SANITIZER_FLAGS }}" \
            "-DCMAKE_SHARED_LINKER_FLAGS=${{ env.SEEKDB_SANITIZER_FLAGS }}"

      - *build-tests
      # Pure-C guardrail runs only in the regular build job: ASan/UBSan linker
      # flags can add libstdc++ to instrumented shared libs even for C code.
      - *run-tests
