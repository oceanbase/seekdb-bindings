name: Pull Request Build and Test

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Debug
  BUILD_DIR: build/ci/lib
  TEST_TARGET: seekdb_tests
  BINARY_REPOSITORY: oceanbase/seekdb
  PACKAGE_OS: linux
  PACKAGE_ARCH: x86_64
  PACKAGE_TARGET: linux-x86_64
  BUILD_JOBS: 0

jobs:
  format-check:
    name: Format check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format-14
      - name: Run clang-format check
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" -- \
              'lib/include/*.h' 'lib/src/*.c' 'lib/src/*.h' \
              'lib/tests/*.cc' 'lib/tests/*.h' \
              'python/src/*.cc' 'python/src/*.cpp' 'python/src/*.h' \
              'typescript/native/*.c'
          )
          if [ "${#files[@]}" -gt 0 ]; then
            clang-format-14 --dry-run --Werror "${files[@]}"
          fi

  engine:
    name: Select prebuilt seekdb
    runs-on: ubuntu-22.04
    outputs:
      run_id: ${{ steps.engine.outputs.run_id }}
      artifact: ${{ steps.engine.outputs.artifact }}
      source_commit: ${{ steps.engine.outputs.source_commit }}
      packaging_ref: ${{ steps.engine.outputs.packaging_ref }}
      timestamp: ${{ steps.engine.outputs.timestamp }}
      dependency_key: ${{ steps.engine.outputs.dependency_key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select one existing master binary for all test jobs
        id: engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci.py select-engine

  test:
    name: Build and test
    needs: engine
    runs-on: ubuntu-22.04
    steps:
      - &checkout-with-submodules
        name: Checkout bindings and their dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - &setup-python
        name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - &install-python-build-dependencies
        name: Install binding build dependencies
        run: python -m pip install --upgrade pip nanobind scikit-build-core PyMySQL aiomysql 'cmake>=3.26,<4' ninja
      - &checkout-packaging-tools
        name: Check out binary-format tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceanbase/seekdb
          ref: ${{ needs.engine.outputs.packaging_ref }}
          path: _seekdb
          sparse-checkout: package
          persist-credentials: false
      - &download-engine
        name: Download the selected engine and runtime libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: ${{ env.BINARY_REPOSITORY }}
          run-id: ${{ needs.engine.outputs.run_id }}
          name: ${{ needs.engine.outputs.artifact }}
          github-token: ${{ github.token }}
          path: input
      - &elf-tools
        name: Install ELF utilities
        run: sudo apt-get update -qq && sudo apt-get install -y patchelf
      - &prepare-runtime
        name: Verify and stage the complete engine runtime
        env:
          BINARY_RUN_ID: ${{ needs.engine.outputs.run_id }}
          BINARY_SOURCE_COMMIT: ${{ needs.engine.outputs.source_commit }}
          PACKAGE_TIMESTAMP: ${{ needs.engine.outputs.timestamp }}
        run: python .github/scripts/ci.py runtime
      - name: Configure bindings
        run: cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DSEEKDB_BIN="$SEEKDB_BIN"
      - name: Build driver, Python extension and C/C++ tests
        run: cmake --build "$BUILD_DIR" --target seekdb pylibseekdb "$TEST_TARGET" --parallel
      - name: Verify Python migration and external driver integration
        run: python .github/scripts/ci.py python-tests
      - name: Verify Python binding exception contract
        run: python .github/scripts/ci.py python-contract
      - name: Verify the C driver has no C++ runtime dependency
        run: python .github/scripts/ci.py pure-c
      - &run-tests
        name: Run C/C++ tests
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure

  node-test:
    name: Node.js build and test
    needs: engine
    runs-on: ubuntu-22.04
    env:
      BINARY_RUN_ID: ${{ needs.engine.outputs.run_id }}
      BINARY_SOURCE_COMMIT: ${{ needs.engine.outputs.source_commit }}
      PACKAGE_TIMESTAMP: ${{ needs.engine.outputs.timestamp }}
      PACKAGE_COMPONENT: node
      PIP_CACHE_DIR: ${{ github.workspace }}/deps/.cache/pip
      npm_config_cache: ${{ github.workspace }}/deps/.cache/npm
    steps:
      - *checkout-with-submodules
      - *checkout-packaging-tools
      - *download-engine
      - *elf-tools
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore dependency downloads and static OpenSSL
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/.cache
          key: bindings-deps-v1-linux-x86_64-${{ needs.engine.outputs.dependency_key }}
          restore-keys: bindings-deps-v1-linux-x86_64-
      - name: Build and test Node.js against the existing binary
        run: python3 .github/scripts/package.py container
      - name: Verify types and runtime packaging
        run: |
          node typescript/node_modules/typescript/bin/tsc -p typescript/tsconfig.test.json --noEmit
          node --test typescript/test/packaging.test.mjs
      - name: Verify the npm tarball installs without a build
        run: |
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/dist/*.tgz
          cd "$install_dir"
          node --input-type=module -e 'import { seekdb } from "@oceanbase/seekdb-node"; seekdb.checkPlatform()'
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify Node.js 22 with the Node.js 24 native build
        run: node --test typescript/test/binding.test.mjs

  asan-ubsan-test:
    name: ASan/UBSan build and test
    needs: engine
    runs-on: ubuntu-22.04
    env:
      SEEKDB_SANITIZER_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - *checkout-with-submodules
      - *setup-python
      - *install-python-build-dependencies
      - *checkout-packaging-tools
      - *download-engine
      - *elf-tools
      - *prepare-runtime
      - name: Configure instrumented bindings
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DSEEKDB_BIN="$SEEKDB_BIN" \
            "-DCMAKE_C_FLAGS=$SEEKDB_SANITIZER_FLAGS" \
            "-DCMAKE_CXX_FLAGS=$SEEKDB_SANITIZER_FLAGS" \
            "-DCMAKE_EXE_LINKER_FLAGS=$SEEKDB_SANITIZER_FLAGS" \
            "-DCMAKE_SHARED_LINKER_FLAGS=$SEEKDB_SANITIZER_FLAGS"
      - name: Build instrumented tests
        run: cmake --build "$BUILD_DIR" --target "$TEST_TARGET" --parallel
      - *run-tests
