name: Publish bindings release
run-name: Bindings release / ${{ inputs.release_tag }} / ${{ inputs.mode }}

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/release.py'
      - '.github/scripts/package.py'
  workflow_dispatch:
    inputs:
      package_run_ids:
        description: Successful Package bindings run IDs, separated by commas or spaces
        required: true
        type: string
      release_tag:
        description: Release tag, created at the tested bindings commit if absent (e.g. v1.4.0)
        required: true
        type: string
      mode:
        description: Check assets only, create a draft, or publish a prerelease or release
        type: choice
        default: draft
        options: [draft, prerelease, release, check]

permissions:
  contents: read
  actions: read

concurrency:
  group: bindings-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate release script syntax
        run: python -m py_compile .github/scripts/release.py

  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Collect and verify the finished distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_IDS: ${{ inputs.package_run_ids }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python .github/scripts/release.py prepare
      - name: Upload the release plan and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          path: |
            build/release/release-notes.md
            build/release/assets/release-manifest.json*
            build/release/assets/SHA256SUMS
      - name: Transfer verified release assets
        if: inputs.mode != 'check'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: build/release
      - name: Create or resume the release and verify its uploads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: python .github/scripts/release.py publish
