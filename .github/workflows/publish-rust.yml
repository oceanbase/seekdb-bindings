name: Publish seekdb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-seekdb
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'oceanbase/seekdb-bindings' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      SEEKDB_CACHE_DIR: ${{ github.workspace }}/.cache/seekdb-native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Test the pinned release bundle
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Validate the release package without uploading
        run: python rust/tests/check_package.py
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish seekdb
        run: cargo publish --manifest-path rust/Cargo.toml --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
