[package]
name = "seekdb"
version = "1.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Local seekdb lifecycle bindings for Rust"
publish = false
build = "build.rs"

[dependencies]
dirs = "6"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"

[build-dependencies]
sha2 = "0.10"
tempfile = "3"
ureq = "3.5"

[dev-dependencies]
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
