[package]
name = "seekdb"
version = "1.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Local seekdb lifecycle bindings for Rust"
repository = "https://github.com/oceanbase/seekdb-bindings"
homepage = "https://github.com/oceanbase/seekdb-bindings/tree/main/rust"
documentation = "https://docs.rs/seekdb"
keywords = ["seekdb", "database", "embedded", "sql"]
categories = ["database"]
readme = "README.md"
publish = ["crates-io"]
build = "build.rs"
include = ["Cargo.toml", "Cargo.lock", "build.rs", "build_cache.rs", "bundle_manifest.rs", "manifest_cache.rs", "native_cache.rs", "bundles/*.json", "src/**", "examples/**", "tests/*.rs", "LICENSE", "NOTICE", "PATENTS", "THIRD_PARTY_NOTICES.md", "README.md", "docs/**"]

[package.metadata.seekdb]
native-version = "1.4.0.0-r2"
manifest-sha256 = "e423d7820050fd5918b1c07748b068d4fc6f3746af61767980a9d8bc1d4f9b49"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[dependencies]
dirs = "6"
flate2 = "1"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27.0"

[build-dependencies]
dirs = "6"
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27.0"
ureq = { version = "3.5", features = ["platform-verifier"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
url = "2"

[dev-dependencies]
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
url = "2"
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
