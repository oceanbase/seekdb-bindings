[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pylibseekdb"
version = "0.1.0"
description = "Python bindings for the seekdb C client"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "OceanBase", email = "open_oceanbase@oceanbase.com" },
]
maintainers = [
    { name = "OceanBase", email = "open_oceanbase@oceanbase.com" },
]
keywords = ["seekdb", "vector", "database", "search", "AI", "embeddings", "hybrid-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://seekdb.ai"
Repository = "https://github.com/oceanbase/seekdb-bindings"
Documentation = "https://docs.seekdb.ai/"
"Bug Tracker" = "https://github.com/oceanbase/seekdb/issues"

[tool.scikit-build]
cmake.source-dir = "."
build.targets    = ["pylibseekdb"]
wheel.packages   = ["pylibseekdb"]
build-dir        = "../build/python/{wheel_tag}"

[tool.cibuildwheel]
build  = "cp311-* cp312-* cp313-* cp314-*"
skip   = "*-musllinux_*"

environment = { PIP_INDEX_URL = "https://pypi.tuna.tsinghua.edu.cn/simple/" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-build = [
    "yum install -y libaio",
    "cp /usr/lib64/libaio.so.1 /project/build/",
    "patchelf --set-rpath '$ORIGIN' /project/build/seekdb",
]

repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { PIP_INDEX_URL = "https://pypi.tuna.tsinghua.edu.cn/simple/", MACOSX_DEPLOYMENT_TARGET = "15.6" }
config-settings = "cmake.define.CMAKE_CXX_COMPILER=/usr/bin/clang++"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
