name: SeekDBExample
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  SeekDB:
    path: ..
  MySQLNIO:
    url: https://github.com/vapor/mysql-nio.git
    from: "1.0.0"
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: "2.0.0"
targets:
  SeekDBExample:
    type: application
    platform: iOS
    sources:
      - Sources
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.seekdb.example
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SeekDB Example
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: SeekDB
        product: SeekDB
      - package: MySQLNIO
        product: MySQLNIO
      - package: NIO
        product: NIOCore
      - package: NIO
        product: NIOPosix
