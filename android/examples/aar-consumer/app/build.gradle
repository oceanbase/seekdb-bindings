plugins { id 'com.android.application' }

android {
    namespace 'com.oceanbase.seekdb.trial'
    compileSdkVersion 'android-36.1'
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'com.oceanbase.seekdb.trial'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName 'trial'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // SeekDB is spawned as a process, so it needs a real extracted file path.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libseekdb_exec.so']
        }
        resources { excludes += ['META-INF/versions/**'] }
    }
}

dependencies {
    // Native files and Java API come exclusively from this AAR.
    implementation files('libs/seekdb-android.aar')
    // Example driver only; not a transitive dependency of the AAR.
    implementation files('libs/mariadb-java-client-3.5.6.jar')
}
